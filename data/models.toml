# 一覧の元データ。README.md / README.en.md の表はここから scripts/build_readme.py で作る。
# 追加・修正はこのファイルだけを編集し、`python scripts/build_readme.py` を実行する。
#
# 項目:
#   name        表示名
#   url         公式（モデルカードかリポジトリ）
#   org         開発元
#   ja          "native"（日本語専用・特化） / "multi"（多言語の一つとして対応）
#   streaming   ASR: "true"（真のストリーミング） / "pseudo"（区切って再推論） / "no"
#               TTS: "true"（文の途中から音を出せる） / "no"
#   runtime     動かし方（PyTorch / ONNX / sherpa-onnx / GGUF など）
#   size        パラメータ数や重みの大きさ（分かる範囲）
#   license     ライセンス。モデルとコードで違うときは分けて書く。確かめていないものは "要確認"
#   commercial  "yes" / "no" / "model"（声やモデルごとに違う） / "tbd"（要確認）
#   bench       測定結果のあるページ（benchmarks/ 以下）。無ければ省略
#   note_ja / note_en  一言メモ

# ---------------------------------------------------------------------------- ASR
[[asr]]
name = "Fun-ASR-Nano-2512"
url = "https://github.com/QwenAudio/Fun-ASR"
org = "Alibaba (FunAudioLLM)"
ja = "multi"
streaming = "no"
runtime = "PyTorch, sherpa-onnx, CrispASR, audio.cpp"
size = "約 0.8B（音声エンコーダ + Qwen3-0.6B デコーダ）"
license = "要確認（モデル固有）"
commercial = "tbd"
bench = "benchmarks/asr/2026-11-3sets.md"
note_ja = "読みの CER は FLEURS 0.033・ReazonSpeech 0.125・Common Voice 0.034（funasr・CUDA）。sherpa-onnx 版は放送の話し言葉で崩れやすい（0.190）。CrispASR（CUDA）なら 1 発話 約 130 ms と PyTorch（640 ms）の 5 倍速い"
note_en = "Reading-based CER 0.033 (FLEURS), 0.125 (ReazonSpeech), 0.034 (Common Voice) with funasr on CUDA; the sherpa-onnx build degrades on broadcast speech (0.190). CrispASR (CUDA) is 5x faster than PyTorch (~130 ms vs 640 ms per utterance)"

