[[asr]]
name = "Qwen3-ASR (1.7B / 0.6B)"
url = "https://huggingface.co/Qwen/Qwen3-ASR-1.7B"
org = "Alibaba (Qwen)"
ja = "multi"
streaming = "no"
runtime = "PyTorch, sherpa-onnx, speech.cpp, audio.cpp, CrispASR"
size = "1.7B / 0.6B"
license = "Apache-2.0"
commercial = "yes"
bench = "benchmarks/2026-11-runtimes.md"
note_ja = "52 言語と言語識別。0.6B（PyTorch・CUDA）は読み上げで読みの CER 0.05〜0.06 だが、放送の話し言葉では 0.208 と崩れる。sherpa-onnx 版は stream.set_option(\"language\", \"Japanese\") で言語を指定すること（指定しないと日本語以外で出ることがある）。1.7B は読みの CER 0.029〜0.182。2 人の自由会話では 1.7B 0.091・0.6B 0.105（speech.cpp）と、測った中で最もよい。speech.cpp（GPU）なら 1.7B でも 1 発話 約 165 ms と PyTorch（930 ms）の 5 倍以上速く、CER も同じ"
note_en = "52 languages with language ID. 0.6B (PyTorch, CUDA): reading-based CER 0.05-0.06 on read speech but 0.208 on broadcast speech. With sherpa-onnx, set stream.set_option(\"language\", \"Japanese\"), otherwise some utterances come out in other languages. 1.7B: reading-based CER 0.029-0.182. On free two-person conversation it was the best we measured (1.7B 0.091, 0.6B 0.105 with speech.cpp); speech.cpp (GPU) runs it at ~165 ms per utterance, over 5x faster than PyTorch (930 ms) with the same CER"

