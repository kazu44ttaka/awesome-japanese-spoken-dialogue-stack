note_en = "Kotoba-Whisper v2.0 fine-tuned on anime and game dialogue. Reading-based CER 0.043 (FLEURS), 0.191 (ReazonSpeech), 0.036 (Common Voice): worse than the base Kotoba-Whisper (0.038 / 0.077 / 0.032) on broadcast speech. On free two-person conversation it scored 0.145, about the same as Kotoba-Whisper (0.152). The community whisper.cpp conversion (CrispASR) is much worse"

