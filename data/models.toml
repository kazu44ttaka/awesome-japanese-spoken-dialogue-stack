# 一覧の元データ。README.md / README.en.md の表はここから scripts/build_readme.py で作る。
# 追加・修正はこのファイルだけを編集し、`python scripts/build_readme.py` を実行する。
#
# 項目:
#   name        表示名
#   url         公式（モデルカードかリポジトリ）
#   org         開発元
#   ja          "native"（日本語専用・特化） / "multi"（多言語の一つとして対応）
#   streaming   ASR: "true"（真のストリーミング） / "pseudo"（区切って再推論） / "no"
#               TTS: "true"（文の途中から音を出せる） / "no"
#   runtime     動かし方（PyTorch / ONNX / sherpa-onnx / GGUF など）
#   size        パラメータ数や重みの大きさ（分かる範囲）
#   license     ライセンス。モデルとコードで違うときは分けて書く。確かめていないものは "要確認"
#   commercial  "yes" / "no" / "cond"（年商などの条件つきで可） / "model"（声やモデルごとに違う） /
#               "unknown"（ライセンスの記載が無い） / "tbd"（要確認）
#   bench       測定結果のあるページ（benchmarks/ 以下）。無ければ省略
#   cer         ASR の読みの CER [FLEURS, ReazonSpeech, Common Voice, 会話]。測っていないものは nan
#   tts_ms / tts_cer / utmos / first_voice_ms  TTS の 1 文の合成時間（GPU）・読みの CER・UTMOS・最初の声までの時間（中央値）
#   overlap     評価データで学習しているもの（"fleurs" / "reazonspeech" / "cv"）。表で † を付け、太字のいちばんよい値から外す
#   measured / measured_en  上の値を測った構成（実行系など）
#   note_ja / note_en  一言メモ

# ---------------------------------------------------------------------------- ASR
[[asr]]
name = "Fun-ASR-Nano-2512"
url = "https://github.com/QwenAudio/Fun-ASR"
org = "Alibaba (FunAudioLLM)"
ja = "multi"
streaming = "no"
runtime = "PyTorch, sherpa-onnx, CrispASR, audio.cpp"
size = "約 0.8B（音声エンコーダ + Qwen3-0.6B デコーダ）"
license = "Apache-2.0"
commercial = "yes"
bench = "benchmarks/asr/2026-11-3sets.md"
cer = [0.033, 0.125, 0.034, 0.176]
measured = "funasr"
measured_en = "funasr"
note_ja = "CrispASR（GPU）で 1 発話 約 130 ms と PyTorch の 5 倍速い。会話の値は相づち 3 区間の繰り返しの暴走を含む（除くと 0.093）。sherpa-onnx 版は話し言葉で崩れる"
note_en = "~130 ms per utterance with CrispASR on GPU, 5x faster than PyTorch. The conversation score includes 3 runaway repetitions on backchannels (0.093 without them). The sherpa-onnx build degrades on conversational speech"

