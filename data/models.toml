note_ja = "読みの CER 0.023〜0.092。GPU なら NeMo で 1 発話 約 55 ms・speech.cpp で 約 40 ms、CPU でも sherpa-onnx の CTC 版で 約 180 ms と速い。疑似ストリーミング（0.25 秒ごとに認識し直す）で、音素を話し終えてから文字が出るまで 約 70 ms と、真のストリーミングのモデルより速い。CrispASR 版は発話の前後の小さな声まで書き起こして CER が悪い"
note_en = "Reading-based CER 0.023-0.092. Fast: ~55 ms per utterance with NeMo and ~40 ms with speech.cpp on GPU, ~180 ms with the sherpa-onnx CTC export on CPU. With pseudo-streaming (re-decoding every 0.25 s), text appears ~70 ms after each phoneme, faster than true streaming models. The CrispASR build also transcribes faint background speech, hurting CER"

