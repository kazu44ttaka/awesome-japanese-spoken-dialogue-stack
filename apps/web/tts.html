<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 TTS デモ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>日本語 TTS デモ <small>この PC で合成 → ブラウザで再生</small></h1>

  <section class="panel">
    <h2>TTS制御</h2>
    <div class="row">
      <label class="name" for="engine">TTSエンジン</label>
      <select id="engine" class="grow"></select>
    </div>
    <div class="row">
      <label class="name" id="deviceLabel" for="device">Device</label>
      <select id="device"></select>
      <button id="start" class="primary" title="エンジンを使える状態にする。AivisSpeech / VOICEVOX は動いていなければ立ち上げる">起動</button>
      <button id="stopEngine" title="エンジンを止める（このアプリが立ち上げたエンジンだけ。前から動いていたものはそのまま）">停止</button>
    </div>
    <div class="row">
      <label class="name">状態</label>
      <span class="state"><span id="lamp" class="lamp"></span>TTS <span id="stateText">停止</span></span>
      <span id="stateDetail" class="status"></span>
    </div>
  </section>

  <section class="panel">
    <h2>TTSテスト</h2>
    <div class="row">
      <label class="name" for="voice">Voice/Speaker</label>
      <select id="voice" class="grow"></select>
      <label for="speed">話速（1.00が標準）</label>
      <input id="speed" type="number" min="0.5" max="2" step="0.05" value="1.00">
    </div>
    <div class="row">
      <label class="name" for="sink">スピーカーデバイス</label>
      <select id="sink" class="grow"><option value="">default</option></select>
      <label for="sample">例文</label>
      <select id="sample"></select>
    </div>
    <div class="row"><label><input id="split" type="checkbox" checked> 文ごとに合成して、できた文から再生（音声対話向け）</label></div>
    <div class="row"><label class="name" for="text">テスト発話</label></div>
    <textarea id="text"></textarea>
    <div class="row">
      <button id="speak" class="primary" disabled title="テスト発話を合成して再生する">TTSテスト</button>
      <button id="halt">再生を止める</button>
      <button id="save" disabled>WAV で保存</button>
      <span id="status" class="status"></span>
    </div>
    <div id="summary" class="summary"></div>
    <div id="log" class="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let engines = [], samples = {}, labels = {}, colors = {};
let ws = null, state = 'stopped', speaking = false;
let audioCtx = null, playHead = 0, sources = [];
let tClick = 0, firstPlay = null;

function engine() { return engines[$('engine').selectedIndex]; }
function setStatus(text, error = false) { $('status').textContent = text; $('status').classList.toggle('error', error); }
function setState(s, detail) {
  state = s;
  $('lamp').style.background = colors[s] || '#9e9e9e';
  $('stateText').textContent = labels[s] || s;
  $('stateDetail').textContent = detail || (engine() ? engine().note : '');
  $('stateDetail').classList.toggle('error', s === 'error');
  syncButtons();
}
function syncButtons() {
  $('engine').disabled = state === 'starting';  // 起動の途中では切り替えない
  $('start').disabled = state === 'starting';
  $('stopEngine').disabled = !(state === 'running' || state === 'error');
  $('speak').disabled = state !== 'running' || speaking;
}
function syncEngine() {
  const e = engine();
  $('device').textContent = '';
  $('deviceLabel').textContent = e.device_label;
  const items = e.devices.length ? e.devices : [e.fixed_device];
  for (const d of items) { const o = document.createElement('option'); o.value = e.devices.length ? d : ''; o.textContent = d; $('device').append(o); }
  $('device').disabled = !e.devices.length;
  if (e.default_device) $('device').value = e.default_device;
  $('device').title = !e.devices.length ? 'このエンジンはデバイスを選べない' : (e.http ? 'AivisSpeech / VOICEVOX は、このアプリが立ち上げるときだけ効く' : '');
  if (state !== 'running' && state !== 'starting') $('stateDetail').textContent = e.note;
}
function setVoices(voices) {
  $('voice').textContent = '';
  for (const [id, label] of voices) { const o = document.createElement('option'); o.value = id; o.textContent = label; $('voice').append(o); }
}
function addLog(text, meta) {
  const line = document.createElement('div'); line.className = 'line'; line.textContent = text;
  $('log').append(line);
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; $('log').append(m); }
  $('log').scrollTop = $('log').scrollHeight;
}

// 再生の仕組み（AudioContext）は最初に画面を触ったときに作り、ずっと動かしておく（無音を流し続ける）。
// 鳴らす直前に作ると、デバイスが動き出すまで（Bluetooth などでは数百 ms）に 1 文目の頭が消えるため
let readyAt = 0;  // デバイスが動き出したとみなす時刻（AudioContext の時計）
async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext({latencyHint: 'playback'});  // 余裕のあるバッファで音切れを防ぐ
    const keep = audioCtx.createConstantSource();
    keep.offset.value = 0;
    keep.connect(audioCtx.destination);
    keep.start();
  }
  if ($('sink').value !== (audioCtx.sinkId || '') && audioCtx.setSinkId) {
    try { await audioCtx.setSinkId($('sink').value); readyAt = audioCtx.currentTime + 0.4; }
    catch (e) { setStatus(`スピーカーを切り替えられませんでした: ${e}`, true); }
  }
  if (audioCtx.state !== 'running') {
    await audioCtx.resume();
    readyAt = audioCtx.currentTime + 0.4;
  }
}
document.addEventListener('pointerdown', () => { ensureAudio(); }, {once: true});
async function playWav(buf) {
  await ensureAudio();
  const audio = await audioCtx.decodeAudioData(buf);
  const src = audioCtx.createBufferSource();
  src.buffer = audio;
  src.connect(audioCtx.destination);
  // 前の文の終わりにぴったり続ける（間に合わなかったときは少し先から鳴らす）
  const start = Math.max(audioCtx.currentTime + 0.05, playHead, readyAt);
  src.start(start);
  playHead = start + audio.duration;
  sources.push(src);
  src.onended = () => { sources = sources.filter((s) => s !== src); };
  if (firstPlay === null) firstPlay = performance.now() - tClick + (start - audioCtx.currentTime) * 1000;
}
function stopPlayback() {
  for (const s of sources) { try { s.stop(); } catch (e) { /* もう終わっている */ } }
  sources = [];
  playHead = 0;
}

async function handle(ev) {
  if (ev.data instanceof ArrayBuffer) { await playWav(ev.data); return; }
  const msg = JSON.parse(ev.data);
  const d = msg.data || [];
  switch (msg.type) {
    case 'hello':
      if (msg.engine) { const i = engines.findIndex((e) => e.name === msg.engine); if (i >= 0) { $('engine').selectedIndex = i; syncEngine(); } }
      if (msg.device) $('device').value = msg.device;
      setVoices(msg.voices || []);
      setState(msg.state, msg.detail);
      break;
    case 'state': setState(d[0], d[1]); break;
    case 'voices': setVoices(d[0]); break;
    case 'status': setStatus(d[0]); break;
    case 'error': setStatus(d[0], true); break;
    case 'sentence': {
      const [i, n, sentence, ms, dur] = d;
      addLog(`[${i}/${n}] ${sentence}`, `合成 ${ms.toFixed(0)} ms・音声 ${dur.toFixed(1)} 秒・RTF ${(ms / 1000 / Math.max(dur, 1e-6)).toFixed(3)}`);
      break;
    }
    case 'done': {
      const [first, total, audioS, n] = d;
      speaking = false;
      if (first !== null) {
        const rtf = total / 1000 / Math.max(audioS, 1e-6);
        const play = firstPlay === null ? '' : `（ブラウザで鳴るまで ${firstPlay.toFixed(0)} ms）`;
        $('summary').textContent = `再生開始まで ${first.toFixed(0)} ms${play} ・ 全体の合成 ${total.toFixed(0)} ms ・ 音声 ${audioS.toFixed(1)} 秒 ・ RTF ${rtf.toFixed(3)}（${n} 文）`;
        addLog('─'.repeat(40));
        $('save').disabled = false;
      } else {
        $('summary').textContent = '';
      }
      break;
    }
  }
  syncButtons();
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onclose = () => setState('error', 'サーバーとの接続が切れました。ページを再読み込みしてください');
  // 音声のデコードを待つあいだに次の通知を処理しないよう、届いた順に 1 つずつ処理する
  let chain = Promise.resolve();
  ws.onmessage = (ev) => { chain = chain.then(() => handle(ev)).catch((e) => setStatus(`${e}`, true)); };
}

async function listSinks() {
  if (!('setSinkId' in AudioContext.prototype)) { $('sink').disabled = true; $('sink').title = 'このブラウザはスピーカーを選べない（既定のデバイスで鳴る）'; return; }
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    devs.filter((d) => d.kind === 'audiooutput' && d.deviceId !== 'default' && d.deviceId !== 'communications').forEach((d, i) => {
      const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || `スピーカー ${i + 1}`; $('sink').append(o);
    });
  } catch (e) { /* 一覧を取れないブラウザは既定だけ */ }
}

// MaAI-SDS と同じく、TTSエンジンを切り替えたら前のエンジンを止める（新しいものは「起動」で起動する）
$('engine').onchange = () => {
  if (state === 'running' || state === 'error') {
    stopPlayback();
    setVoices([]);
    ws.send(JSON.stringify({type: 'stop_engine'}));
  }
  syncEngine();
};
$('start').onclick = () => ws.send(JSON.stringify({type: 'start', name: engine().name, device: $('device').value}));
$('stopEngine').onclick = () => { stopPlayback(); ws.send(JSON.stringify({type: 'stop_engine'})); };
$('speak').onclick = async () => {
  const text = $('text').value.trim();
  if (!text) return;
  await ensureAudio();  // ボタンを押したときに作る（ブラウザの自動再生の制限）
  stopPlayback();
  tClick = performance.now(); firstPlay = null; speaking = true; syncButtons();
  $('summary').textContent = '合成中…';
  setStatus('');
  ws.send(JSON.stringify({type: 'speak', text, voice: $('voice').value, speed: Number($('speed').value), split: $('split').checked}));
};
$('halt').onclick = () => { ws.send(JSON.stringify({type: 'halt'})); stopPlayback(); };
$('save').onclick = () => { location.href = '/api/last.wav'; };
$('sample').onchange = () => { $('text').value = samples[$('sample').value]; };

fetch('/api/engines').then((r) => r.json()).then((j) => {
  engines = j.engines; samples = j.samples; labels = j.state_labels; colors = j.state_colors;
  for (const e of engines) { const o = document.createElement('option'); o.value = e.name; o.textContent = e.label; $('engine').append(o); }
  $('engine').selectedIndex = Math.max(0, engines.findIndex((e) => e.name === j.default));
  for (const k of Object.keys(samples)) { const o = document.createElement('option'); o.value = k; o.textContent = k; $('sample').append(o); }
  $('text').value = Object.values(samples)[0] || '';
  syncEngine();
  setState('stopped');
  listSinks();
  connect();
});
</script>
</body>
</html>
