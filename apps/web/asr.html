<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 ASR デモ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>日本語 ASR デモ <small>ブラウザのマイク → この PC で認識</small></h1>

  <section class="panel">
    <h2>ASR制御</h2>
    <div class="row">
      <label class="name" for="model">ASRエンジン</label>
      <select id="model" class="grow"></select>
    </div>
    <div class="row">
      <label class="name" for="device">Device</label>
      <select id="device"><option value="cuda">cuda</option><option value="cpu">cpu</option></select>
      <button id="startModel" class="primary" title="モデルを読み込んで、すぐ認識できる状態にする（初回はダウンロードする）">起動</button>
      <button id="stopModel" title="モデルを閉じてメモリを空ける">停止</button>
    </div>
    <div class="row">
      <label class="name">状態</label>
      <span class="state"><span id="lamp" class="lamp"></span>ASR <span id="stateText">停止</span></span>
      <span id="stateDetail" class="status">ASRエンジンと Device を選んで「起動」を押してください</span>
    </div>
  </section>

  <section class="panel">
    <h2>共通設定 <small>MaAI-SDS の ASR の「共通設定」と同じ項目・既定値</small></h2>
    <div class="grid">
      <label for="vad_on_threshold" title="Silero VAD の確率がこれを超えたら話している">VAD ON threshold</label><input id="vad_on_threshold" type="number" step="0.05" min="0" max="1">
      <label for="min_segment_sec" title="これより短い区間は認識せず、直前の途中経過で確定する">Min segment sec</label><input id="min_segment_sec" type="number" step="0.05" min="0">
      <label for="vad_on_sec" title="ON threshold を超える状態がこの秒数続いたら発話の始まり">VAD ON sec</label><input id="vad_on_sec" type="number" step="0.05" min="0.03">
      <label for="pre_roll_buffer_sec" title="発話の始まりと判定する前の音も、この秒数だけ区間に入れる">Pre-roll buffer sec</label><input id="pre_roll_buffer_sec" type="number" step="0.05" min="0">
      <label for="vad_off_threshold" title="Silero VAD の確率がこれを下回ったら黙っている">VAD OFF threshold</label><input id="vad_off_threshold" type="number" step="0.05" min="0" max="1">
      <label for="pseudo" title="疑似ストリーミング: 話している途中も、区間の頭から認識し直して途中経過を出す">Pseudo streaming</label><label><input id="pseudo" type="checkbox"> 有効</label>
      <label for="vad_off_sec" title="OFF threshold を下回る状態がこの秒数続いたら発話の終わり">VAD OFF sec</label><input id="vad_off_sec" type="number" step="0.05" min="0.03">
      <label for="pseudo_chunk_sec" title="疑似ストリーミングで、音声のこの秒数ごとに区間の頭から認識し直す">Pseudo chunk sec</label><input id="pseudo_chunk_sec" type="number" step="0.05" min="0.05">
    </div>
    <div class="row"><button id="resetOpts" title="MaAI-SDS の controller_config.json と同じ値に戻す">既定に戻す</button></div>
  </section>

  <section class="panel">
    <h2>聞き取り</h2>
    <div class="row">
      <label class="name" for="mic">マイクデバイス</label>
      <select id="mic" class="grow"><option value="">default</option></select>
      <button id="listen" class="primary" disabled>聞き取り開始</button>
      <button id="unlisten" disabled>聞き取り停止</button>
      <button id="clear">クリア</button>
    </div>
    <div class="row">
      <span>入力</span><div class="meter"><div id="level"></div></div>
      <span>VAD</span><div class="meter"><div id="vad"></div></div>
      <span id="listenStatus" class="status"></span>
    </div>
    <div id="log" class="log asrlog"></div>
  </section>
  <p class="note">マイクはこの PC で開いたとき（127.0.0.1 / localhost）だけ使えます。ほかの PC から開くときは HTTPS が必要です。</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const OPT_KEYS = ['pseudo_chunk_sec', 'pre_roll_buffer_sec', 'min_segment_sec', 'vad_on_threshold', 'vad_on_sec', 'vad_off_threshold', 'vad_off_sec'];
let models = [], defaults = {}, labels = {}, colors = {};
let ws = null, state = 'stopped', listening = false;
let audioCtx = null, mediaStream = null, worklet = null;

// 入力の音（48 kHz など）を 16 kHz・float32 にして 512 サンプルずつ送る AudioWorklet
const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.width = Math.max(1, Math.round(this.ratio));  // 間引く前の簡単な低域通過（移動平均）
    this.hist = new Float32Array(this.width);
    this.hi = 0; this.sum = 0;
    this.pos = 0; this.prev = 0;
    this.out = new Float32Array(512); this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    const x = new Float32Array(ch.length);
    for (let i = 0; i < ch.length; i++) {
      this.sum += ch[i] - this.hist[this.hi];
      this.hist[this.hi] = ch[i];
      this.hi = (this.hi + 1) % this.width;
      x[i] = this.sum / this.width;
    }
    let p = this.pos;
    while (p < x.length - 1) {
      let v;
      if (p < 0) { v = this.prev + (x[0] - this.prev) * (p + 1); }
      else { const i0 = Math.floor(p), f = p - i0; v = x[i0] + (x[i0 + 1] - x[i0]) * f; }
      this.out[this.n++] = v;
      if (this.n === this.out.length) { this.port.postMessage(this.out.slice(0)); this.n = 0; }
      p += this.ratio;
    }
    this.pos = p - x.length;
    this.prev = x[x.length - 1];
    return true;
  }
}
registerProcessor('capture-16k', Capture);
`;

function setState(s, detail) {
  state = s;
  $('lamp').style.background = colors[s] || '#9e9e9e';
  $('stateText').textContent = labels[s] || s;
  $('stateDetail').textContent = detail || (s === 'stopped' ? 'ASRエンジンと Device を選んで「起動」を押してください' : '');
  $('stateDetail').classList.toggle('error', s === 'error');
  if (s !== 'running' && listening) stopListening(false);
  syncButtons();
}
function setListenStatus(text, error = false) {
  $('listenStatus').textContent = text;
  $('listenStatus').classList.toggle('error', error);
}
function syncButtons() {
  $('model').disabled = state === 'starting';  // 読み込みの途中では切り替えない
  $('startModel').disabled = state === 'starting';
  $('stopModel').disabled = !(state === 'running' || state === 'error');
  $('listen').disabled = state !== 'running' || listening;
  $('unlisten').disabled = !listening;
}
function syncDevice() {
  const m = models[$('model').selectedIndex];
  if (!m) return;
  if (!m.gpu) $('device').value = 'cpu';
  $('device').disabled = !m.gpu;
}
function setOptions(o) {
  $('pseudo').checked = !!o.pseudo;
  for (const k of OPT_KEYS) $(k).value = o[k];
}
function getOptions() {
  const o = {pseudo: $('pseudo').checked};
  for (const k of OPT_KEYS) o[k] = Number($(k).value);
  return o;
}
// 認識結果は MaAI-SDS の ASR の結果欄と同じ書き方: 途中経過は最後の行を上書きし、確定したら置き換えて改行
let partialLine = null;  // 最後の行が途中経過なら、その要素
function putLine(line, final) {
  let el = partialLine;
  if (!el) { el = document.createElement('div'); el.className = 'line'; $('log').append(el); }
  el.textContent = line;
  el.classList.toggle('partial', !final);
  partialLine = final ? null : el;
  $('log').scrollTop = $('log').scrollHeight;
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onclose = () => { stopMic(); listening = false; setState('error', 'サーバーとの接続が切れました。ページを再読み込みしてください'); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    const d = msg.data || [];
    switch (msg.type) {
      case 'hello':
        if (msg.model) { const i = models.findIndex((m) => m.name === msg.model); if (i >= 0) { $('model').selectedIndex = i; syncDevice(); } }
        if (msg.device) $('device').value = msg.device;
        setState(msg.state, msg.detail);
        break;
      case 'state':
        setState(d[0], d[1]);
        break;
      case 'status': setListenStatus(d[0]); break;
      case 'error': setListenStatus(d[0], true); break;
      case 'listening':
        if (d[0]) setListenStatus(`聞いています…（${d[1] ? '真のストリーミング' : ($('pseudo').checked ? '疑似ストリーミング' : '確定だけ')}）`);
        break;
      case 'level': $('level').style.width = `${Math.round(d[0] * 100)}%`; break;
      case 'vad': $('vad').style.width = `${Math.round(d[0] * 100)}%`; break;
      case 'partial':
        if (d[0]) putLine(`${d[0]} (latency=${(d[2] / 1000).toFixed(3)}s)`, false);
        break;
      case 'final':  // MaAI-SDS と同じく、空の確定は書かない
        if (d[0]) putLine(`${d[0]} (latency=${(d[3] / 1000).toFixed(3)}s)`, true);
        break;
    }
    syncButtons();
  };
}

async function listMics() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cur = $('mic').value;
    $('mic').textContent = '';
    const def = document.createElement('option'); def.value = ''; def.textContent = 'default'; $('mic').append(def);
    devs.filter((d) => d.kind === 'audioinput' && d.deviceId !== 'default' && d.deviceId !== 'communications').forEach((d, i) => {
      const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || `マイク ${i + 1}`; $('mic').append(o);
    });
    $('mic').value = cur;
  } catch (e) { /* 一覧を取れないブラウザは既定だけ */ }
}

async function startMic() {
  const audio = {channelCount: 1, echoCancellation: true, noiseSuppression: false, autoGainControl: true};
  if ($('mic').value) audio.deviceId = {exact: $('mic').value};
  mediaStream = await navigator.mediaDevices.getUserMedia({audio});
  listMics();  // 許可のあとは名前つきで出る
  audioCtx = new AudioContext();
  const url = URL.createObjectURL(new Blob([WORKLET], {type: 'application/javascript'}));
  await audioCtx.audioWorklet.addModule(url);
  const source = audioCtx.createMediaStreamSource(mediaStream);
  worklet = new AudioWorkletNode(audioCtx, 'capture-16k');
  worklet.port.onmessage = (ev) => { if (ws && ws.readyState === 1 && listening) ws.send(ev.data.buffer); };
  source.connect(worklet);
  const mute = audioCtx.createGain(); mute.gain.value = 0;  // 処理を止めないためにつなぐ（音は出さない）
  worklet.connect(mute).connect(audioCtx.destination);
}
function stopMic() {
  if (worklet) { worklet.port.onmessage = null; worklet.disconnect(); worklet = null; }
  if (mediaStream) { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  $('level').style.width = '0';
  $('vad').style.width = '0';
  partialLine = null;  // 確定しないまま止めたときは、途中経過の行を残して次は改行する
}
function stopListening(send = true) {
  if (send && ws && ws.readyState === 1) ws.send(JSON.stringify({type: 'unlisten'}));
  listening = false;
  stopMic();
  setListenStatus('');
  syncButtons();
}

// MaAI-SDS と同じく、ASRエンジンを切り替えたら前のエンジンを止める（新しいものは「起動」で読み込む）
$('model').onchange = () => {
  syncDevice();
  if (state === 'running' || state === 'error') {
    if (listening) stopListening();
    ws.send(JSON.stringify({type: 'stop_model'}));
  }
};
$('startModel').onclick = () => {
  if (listening) stopListening();
  ws.send(JSON.stringify({type: 'start_model', name: models[$('model').selectedIndex].name, device: $('device').value}));
};
$('stopModel').onclick = () => { if (listening) stopListening(); ws.send(JSON.stringify({type: 'stop_model'})); };
$('listen').onclick = async () => {
  if (!navigator.mediaDevices || !window.isSecureContext) {
    setListenStatus('このページではマイクを使えません（127.0.0.1 か localhost で開くか、HTTPS にしてください）', true);
    return;
  }
  try { await startMic(); } catch (e) { setListenStatus(`マイクを使えませんでした: ${e}`, true); stopMic(); return; }
  listening = true; syncButtons();
  ws.send(JSON.stringify({type: 'listen', options: getOptions()}));
};
$('unlisten').onclick = () => stopListening();
$('clear').onclick = () => { $('log').textContent = ''; partialLine = null; };
$('resetOpts').onclick = () => setOptions(defaults);

fetch('/api/models').then((r) => r.json()).then((j) => {
  models = j.models; defaults = j.options; labels = j.state_labels; colors = j.state_colors;
  for (const m of models) { const o = document.createElement('option'); o.textContent = m.label; o.value = m.name; $('model').append(o); }
  $('model').selectedIndex = Math.max(0, models.findIndex((m) => m.name === j.default));
  setOptions(defaults);
  syncDevice();
  setState('stopped');
  listMics();
  connect();
});
</script>
</body>
</html>
