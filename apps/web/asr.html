<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語 ASR デモ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>日本語 ASR デモ <small>ブラウザのマイク → この PC で認識</small></h1>

  <div class="panel">
    <div class="row">
      <label class="name" for="model">モデル</label>
      <select id="model" class="grow"></select>
      <label for="device">実行</label>
      <select id="device"><option>cpu</option><option>cuda</option></select>
      <button id="load">読み込み</button>
    </div>
    <div class="row">
      <label class="name">方式</label>
      <label><input type="radio" name="mode" value="partial" checked> 疑似ストリーミング（途中経過も出す）</label>
      <label><input type="radio" name="mode" value="final"> VAD で区切る（確定だけ）</label>
    </div>
    <div class="row">
      <label class="name" for="interval">途中経過</label>
      <input id="interval" type="number" min="100" max="3000" step="100" value="500"> ms ごと
      <label for="silence" style="margin-left:12px">無音で区切る</label>
      <input id="silence" type="number" min="0.1" max="2" step="0.1" value="0.4"> 秒
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="start" class="primary" disabled>開始</button>
      <button id="stop" disabled>停止</button>
      <button id="clear">クリア</button>
      <span>入力</span><div class="meter"><div id="level"></div></div>
      <span id="status" class="status">接続しています…</span>
    </div>
    <div id="partial" class="partial"></div>
    <div id="log" class="log"></div>
  </div>
  <p class="note">マイクはこの PC で開いたとき（127.0.0.1 / localhost）だけ使えます。ほかの PC から開くときは HTTPS が必要です。</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let models = [];
let ws = null;
let ready = false;
let listening = false;
let audioCtx = null, mediaStream = null, worklet = null;

// 入力の音（48 kHz など）を 16 kHz・float32 にして 512 サンプルずつ送る AudioWorklet
const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.width = Math.max(1, Math.round(this.ratio));  // 間引く前の簡単な低域通過（移動平均）
    this.hist = new Float32Array(this.width);
    this.hi = 0; this.sum = 0;
    this.pos = 0; this.prev = 0;
    this.out = new Float32Array(512); this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    const x = new Float32Array(ch.length);
    for (let i = 0; i < ch.length; i++) {
      this.sum += ch[i] - this.hist[this.hi];
      this.hist[this.hi] = ch[i];
      this.hi = (this.hi + 1) % this.width;
      x[i] = this.sum / this.width;
    }
    let p = this.pos;
    while (p < x.length - 1) {
      let v;
      if (p < 0) { v = this.prev + (x[0] - this.prev) * (p + 1); }
      else { const i0 = Math.floor(p), f = p - i0; v = x[i0] + (x[i0 + 1] - x[i0]) * f; }
      this.out[this.n++] = v;
      if (this.n === this.out.length) { this.port.postMessage(this.out.slice(0)); this.n = 0; }
      p += this.ratio;
    }
    this.pos = p - x.length;
    this.prev = x[x.length - 1];
    return true;
  }
}
registerProcessor('capture-16k', Capture);
`;

function setStatus(text, error = false) {
  $('status').textContent = text;
  $('status').classList.toggle('error', error);
}

function syncButtons() {
  $('start').disabled = !ready || listening;
  $('stop').disabled = !listening;
}

function syncDevice() {
  const m = models[$('model').selectedIndex];
  if (!m) return;
  if (!m.gpu) $('device').value = 'cpu';
  $('device').disabled = !m.gpu;
}

function addLine(text, meta) {
  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = `${new Date().toLocaleTimeString('ja-JP', {hour12: false})}  ${text || '（認識結果なし）'}`;
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = meta;
  $('log').append(line, m);
  $('log').scrollTop = $('log').scrollHeight;
}

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('モデルを選んで「読み込み」を押してください');
  ws.onclose = () => { stopMic(); listening = false; ready = false; syncButtons(); setStatus('サーバーとの接続が切れました。ページを再読み込みしてください', true); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    const d = msg.data || [];
    switch (msg.type) {
      case 'state':
        ready = msg.ready; listening = false;
        if (msg.model) { const i = models.findIndex((m) => m.name === msg.model); if (i >= 0) { $('model').selectedIndex = i; syncDevice(); } }
        if (msg.status) setStatus(msg.status);
        $('load').disabled = msg.loading;
        break;
      case 'status': setStatus(d[0]); break;
      case 'loaded': ready = true; $('load').disabled = false; setStatus(d[0]); break;
      case 'error': $('load').disabled = false; setStatus(d[0], true); break;
      case 'listening':
        listening = d[0];
        if (!listening) stopMic();
        else setStatus('聞いています…');
        break;
      case 'level': $('level').style.width = `${Math.round(d[0] * 100)}%`; break;
      case 'partial': $('partial').textContent = `途中経過（${d[1].toFixed(0)} ms）: ${d[0]}`; break;
      case 'final':
        $('partial').textContent = '';
        addLine(d[0], `音声 ${d[2].toFixed(1)} 秒・認識 ${d[1].toFixed(0)} ms・話し終わりから表示まで 約 ${d[3].toFixed(0)} ms`);
        break;
    }
    syncButtons();
  };
}

async function startMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: false, autoGainControl: true}});
  audioCtx = new AudioContext();
  const url = URL.createObjectURL(new Blob([WORKLET], {type: 'application/javascript'}));
  await audioCtx.audioWorklet.addModule(url);
  const source = audioCtx.createMediaStreamSource(mediaStream);
  worklet = new AudioWorkletNode(audioCtx, 'capture-16k');
  worklet.port.onmessage = (ev) => { if (ws && ws.readyState === 1 && listening) ws.send(ev.data.buffer); };
  source.connect(worklet);
  const mute = audioCtx.createGain(); mute.gain.value = 0;  // 処理を止めないためにつなぐ（音は出さない）
  worklet.connect(mute).connect(audioCtx.destination);
}

function stopMic() {
  if (worklet) { worklet.port.onmessage = null; worklet.disconnect(); worklet = null; }
  if (mediaStream) { mediaStream.getTracks().forEach((t) => t.stop()); mediaStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  $('level').style.width = '0';
  $('partial').textContent = '';
}

$('model').onchange = () => { syncDevice(); ready = false; syncButtons(); };
$('load').onclick = () => {
  if (listening) ws.send(JSON.stringify({type: 'stop'}));
  ready = false; $('load').disabled = true; syncButtons();
  ws.send(JSON.stringify({type: 'load', name: models[$('model').selectedIndex].name, device: $('device').value}));
};
$('start').onclick = async () => {
  if (!navigator.mediaDevices || !window.isSecureContext) {
    setStatus('このページではマイクを使えません（127.0.0.1 か localhost で開くか、HTTPS にしてください）', true);
    return;
  }
  try { await startMic(); } catch (e) { setStatus(`マイクを使えませんでした: ${e}`, true); stopMic(); return; }
  listening = true; syncButtons();
  ws.send(JSON.stringify({type: 'start', partial: document.querySelector('input[name=mode]:checked').value === 'partial',
    interval_ms: Number($('interval').value), min_silence: Number($('silence').value)}));
};
$('stop').onclick = () => { ws.send(JSON.stringify({type: 'stop'})); listening = false; stopMic(); syncButtons(); };
$('clear').onclick = () => { $('log').textContent = ''; };

fetch('/api/models').then((r) => r.json()).then((j) => {
  models = j.models;
  for (const m of models) { const o = document.createElement('option'); o.textContent = m.label; o.value = m.name; $('model').append(o); }
  $('model').selectedIndex = Math.max(0, models.findIndex((m) => m.name === j.default));
  syncDevice();
  connect();
});
</script>
</body>
</html>
